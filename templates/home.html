{% extends "public_base.html" %}

{% block content %}
  <h1 class="brand">Ascend<span>IQ</span></h1>
  <p class="page__lede">The recruiting profile that stays current because you train inside it.</p>

  <div class="stack">
    {% if user.is_authenticated %}
      <a class="btn-primary" href="{% url 'dashboard' %}">Go to my dashboard</a>
    {% else %}
      <a class="btn-primary" href="{% url 'signup' %}">Sign up</a>
      <a class="btn-ghost" href="{% url 'login' %}">Log in</a>
    {% endif %}
  </div>
{% endblock %}
